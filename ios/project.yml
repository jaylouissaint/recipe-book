# XcodeGen spec for the iPad app (docs/APP_PLAN.md). The .xcodeproj is generated from this file
# and not committed: run `npm run ios:project` (or any of the ios scripts) to make it.
name: RamiyasRecipes
options:
  bundleIdPrefix: com.jaylouissaint
  deploymentTarget:
    iOS: "17.0"
configFiles:
  Debug: Secrets.xcconfig
  Release: Secrets.xcconfig
targets:
  RamiyasRecipes:
    type: application
    platform: iOS
    sources:
      - path: RamiyasRecipes
        excludes: [Fonts/README.md]
    info:
      path: RamiyasRecipes/Info.plist
      properties:
        CFBundleDisplayName: Ramiya's Recipes
        CFBundleShortVersionString: "0.2.0"
        CFBundleVersion: "2"
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIAppFonts:
          - Figtree-Regular.ttf
          - Figtree-Medium.ttf
          - Figtree-SemiBold.ttf
          - Figtree-Bold.ttf
          - InstrumentSerif-Regular.ttf
          - Montserrat-SemiBold.ttf
          - PatrickHand-Regular.ttf
          - ZillaSlab-Light.ttf
          - ZillaSlab-Medium.ttf
        # Filled in from Secrets.xcconfig (made from .env.local by scripts/ios-secrets.sh)
        SupabaseHost: $(SUPABASE_HOST)
        SupabaseAnonKey: $(SUPABASE_ANON_KEY)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jaylouissaint.ramiyasrecipes
        TARGETED_DEVICE_FAMILY: "2" # iPad
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Automatic
  RamiyasRecipesTests:
    type: bundle.unit-test
    platform: iOS
    sources: [RamiyasRecipesTests]
    dependencies:
      - target: RamiyasRecipes
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "2"
        SWIFT_VERSION: "5.0"
schemes:
  RamiyasRecipes:
    build:
      targets:
        RamiyasRecipes: all
    test:
      targets: [RamiyasRecipesTests]
